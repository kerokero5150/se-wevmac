[package]
name = "se-wevmac"
version = "1.0.0"
description = "Mini vMac for the Macintosh SE, as a Mac app"
authors = ["Kay Koba"]
license = "GPL-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
